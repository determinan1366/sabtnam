<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فرم ثبت‌نام دانشجویی - اتصال به Formspree</title>
    <style>
        /* تمام استایل‌ها در همین فایل */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        .container h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
            text-align: center;
        }

        .container p {
            color: #777;
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s ease;
            background-color: #f9f9fc;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background-color: #fff;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        .message.success {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.loading {
            display: block;
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            .container h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📋 فرم ثبت‌نام دانشجو</h1>
        <p>لطفاً اطلاعات خود را دقیق وارد کنید.</p>

        <!-- ✅ آدرس Formspree شما در اینجا قرار گرفته است -->
        <form id="registrationForm" 
              action="https://formspree.io/f/mbdnnnnz" 
              method="POST">

            <!-- فیلد نام -->
            <div class="form-group">
                <label for="firstName">نام:</label>
                <input type="text" id="firstName" name="firstName" placeholder="مثال: علی" required />
            </div>

            <!-- فیلد نام خانوادگی -->
            <div class="form-group">
                <label for="lastName">نام خانوادگی:</label>
                <input type="text" id="lastName" name="lastName" placeholder="مثال: محمدی" required />
            </div>

            <!-- فیلد کد دانشجویی -->
            <div class="form-group">
                <label for="studentId">کد دانشجویی:</label>
                <input type="text" id="studentId" name="studentId" placeholder="مثال: ۹۸۲۳۴۵۶۷" required />
            </div>

            <!-- فیلد ایمیل -->
            <div class="form-group">
                <label for="email">ایمیل:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required />
            </div>

            <!-- فیلد شماره تلفن -->
            <div class="form-group">
                <label for="phone">شماره تلفن:</label>
                <input type="tel" id="phone" name="phone" placeholder="مثال: ۰۹۱۲۳۴۵۶۷۸۹" required />
            </div>

            <!-- فیلد رشته تحصیلی -->
            <div class="form-group">
                <label for="major">رشته تحصیلی:</label>
                <select id="major" name="major" required>
                    <option value="">انتخاب کنید...</option>
                    <option value="مهندسی کامپیوتر">مهندسی کامپیوتر</option>
                    <option value="مهندسی برق">مهندسی برق</option>
                    <option value="مهندسی مکانیک">مهندسی مکانیک</option>
                    <option value="مهندسی عمران">مهندسی عمران</option>
                    <option value="پزشکی">پزشکی</option>
                    <option value="مدیریت">مدیریت</option>
                    <option value="حقوق">حقوق</option>
                    <option value="سایر">سایر</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">ثبت‌نام</button>
            <div id="formMessage" class="message"></div>
        </form>
    </div>

    <script>
        // اسکریپت برای نمایش پیام‌های وضعیت و اعتبارسنجی ساده
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('registrationForm');
            const messageDiv = document.getElementById('formMessage');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', function(e) {
                // اعتبارسنجی ساده سمت کاربر
                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const studentId = document.getElementById('studentId').value.trim();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const major = document.getElementById('major').value;

                if (!firstName || !lastName || !studentId || !email || !phone || !major) {
                    e.preventDefault(); // جلوی ارسال را می‌گیرد
                    showMessage('❌ لطفاً تمام فیلدها را پر کنید.', 'error');
                    return;
                }

                // اگر همه چیز پر بود، پیام در حال ارسال نمایش داده می‌شود
                submitBtn.disabled = true;
                showMessage('⏳ در حال ارسال اطلاعات به Formspree...', 'loading');

                // اجازه می‌دهیم فرم به طور عادی ارسال شود.
                // بعد از ارسال، صفحه رفرش می‌شود.
            });

            // تابع نمایش پیام
            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = 'message ' + type;
            }
        });
    </script>
</body>
</html>
